[package]
name = "oj-safety"
description = "OpenJanitor's safety kernel: deny list, path validation, quarantine, and the only code allowed to delete or move files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
globset = "0.4.21"
oj-windows = { path = "../oj-windows" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
