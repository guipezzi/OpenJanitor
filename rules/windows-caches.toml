# Caches Windows rebuilds on its own. Format: PLANNING.md §5.3.

[[rule]]
id          = "windows.thumbnail-cache"
category    = "system-caches"
level       = "simple"
risk        = "low"
needs_admin = false
paths       = ['%LOCALAPPDATA%\Microsoft\Windows\Explorer']
include     = ["thumbcache_*.db", "iconcache_*.db"]
min_age     = "24h"
name        = "Thumbnail cache"
description = "Preview images File Explorer saves for faster browsing. Windows rebuilds them as needed."
