# Browser caches. Format: PLANNING.md §5.3.
#
# Cache folders only. Cookies, passwords, history, bookmarks, and settings
# are never matched here, and the deny list in oj-safety protects those
# files by name anyway (PLANNING.md §4.2).
#
# Each rule names its browser's program files (`app`). While the browser
# runs, its cache is left out of cleanups, and the confirmation asks you to
# close it (PLANNING.md §6.1).
#
# Chromium browsers (Chrome, Edge, Brave) keep one folder per profile
# ("Default", "Profile 1", ...) inside "User Data", so the patterns start
# with "*/" for the profile. Shader caches sit directly in "User Data".

[[rule]]
id          = "browser.chrome.cache"
category    = "browser-caches"
level       = "simple"
risk        = "low"
needs_admin = false
detect      = '%LOCALAPPDATA%\Google\Chrome\User Data'
paths       = ['%LOCALAPPDATA%\Google\Chrome\User Data']
include     = [
  "*/Cache/**",
  "*/Code Cache/**",
  "*/GPUCache/**",
  "*/DawnGraphiteCache/**",
  "*/DawnWebGPUCache/**",
  "GrShaderCache/**",
  "GraphiteDawnCache/**",
  "ShaderCache/**",
  "GPUPersistentCache/**",
]
min_age     = "24h"
app         = { name = "Google Chrome", processes = ["chrome.exe"] }
name        = "Google Chrome cache"
description = "Copies of web pages, images, and scripts Chrome saved to load sites faster. Sites may load a little slower the first time afterward. Passwords, history, and cookies aren't touched."

