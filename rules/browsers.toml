# Opera keeps its page cache in Local and its profile (with the code and GPU
# caches) in Roaming. Newer versions may add a profile folder, hence "*/".
# "Service Worker" storage is left alone: offline web apps rely on it.
[[rule]]
id          = "browser.opera.cache"
category    = "browser-caches"
level       = "simple"
risk        = "low"
needs_admin = false
detect      = '%APPDATA%\Opera Software'
paths       = [
  '%LOCALAPPDATA%\Opera Software\Opera Stable',
  '%LOCALAPPDATA%\Opera Software\Opera GX Stable',
  '%APPDATA%\Opera Software\Opera Stable',
  '%APPDATA%\Opera Software\Opera GX Stable',
]
include     = [
  "Cache/**",
  "Code Cache/**",
  "GPUCache/**",
  "*/Cache/**",
  "*/Code Cache/**",
  "*/GPUCache/**",
  "GrShaderCache/**",
  "ShaderCache/**",
]
min_age     = "24h"
app         = { name = "Opera", processes = ["opera.exe"] }
name        = "Opera cache"
description = "Copies of web pages, images, and scripts Opera and Opera GX saved to load sites faster. Sites may load a little slower the first time afterward. Passwords, history, and cookies aren't touched."

# Firefox splits each profile in two: settings, passwords, and history in
# Roaming, and caches in Local. Only the Local half is scanned.
[[rule]]
id          = "browser.firefox.cache"
category    = "browser-caches"
level       = "simple"
risk        = "low"
needs_admin = false
detect      = '%LOCALAPPDATA%\Mozilla\Firefox\Profiles'
paths       = ['%LOCALAPPDATA%\Mozilla\Firefox\Profiles']
include     = [
  "*/cache2/**",
  "*/startupCache/**",
  "*/thumbnails/**",
  "*/jumpListCache/**",
  "*/shader-cache/**",
]
min_age     = "24h"
app         = { name = "Firefox", processes = ["firefox.exe"] }
name        = "Firefox cache"
description = "Copies of web pages, images, and scripts Firefox saved to load sites faster. Sites may load a little slower the first time afterward. Passwords, history, and cookies aren't touched."
